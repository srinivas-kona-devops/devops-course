name: Validate course

on:
  pull_request:
    paths: ['course/**']
  push:
    branches: [main]
    paths: ['course/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: course
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate pages
        run: |
          python3 diagrams.py
          python3 build.py
      - name: Fail if generated files are stale
        run: |
          git diff --exit-code -- . || { echo "::error::Generated HTML is out of date. Run diagrams.py and build.py, then commit."; exit 1; }
      - name: Validate (SVG, links, ids, icons, offline rule)
        run: python3 check.py
